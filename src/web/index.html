<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cian Hughes - CV</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/bson@6.8.0/lib/bson.bundle.js"></script>
  </head>
  <body>
    <div class="layout-container">
      <div class="sidebar controls" id="controls">
        <div class="controls-header">
          <strong>CV Generator</strong>
        </div>
        <div class="action-buttons">
          <select id="theme-selector" class="btn">
            <option value="auto">Auto (System)</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="solarized-light">Solarized Light</option>
            <option value="solarized-dark">Solarized Dark</option>
            <option value="dracula">Dracula</option>
            <option value="monokai">Monokai</option>
          </select>
          <button id="download-pdf" class="btn btn-primary">
            Download PDF
          </button>
        </div>
        <div class="options-list">
          <label
            ><input type="checkbox" id="toggle-experience" checked /> Experience
            / Employment</label
          >
          <label
            ><input type="checkbox" id="toggle-education" checked />
            Education</label
          >
          <label
            ><input type="checkbox" id="toggle-publications" checked />
            Publications &amp; Conferences</label
          >
          <label
            ><input type="checkbox" id="toggle-skills" checked /> Skills &amp;
            Languages</label
          >
          <label
            ><input type="checkbox" id="toggle-projects" checked /> Projects
            &amp; Certs</label
          >
        </div>
      </div>

      <div id="cv-content" class="main-content">Loading CV...</div>
    </div>

    <script src="bundle.js"></script>
  </body>
</html>
