[package]
name = "cv-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
hdf5 = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors"] }
clap = { version = "4.5", features = ["derive", "env"] }
