[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-cv"
version = "0.1.0"
description = "CV Generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.5.0",
    "h5py>=3.11.0",
    "pydantic>=2.8.0",
    "typst>=0.11.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
cv = "src.python.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
