[build-system]
requires = ["hatchling", "hatch-calver"]
build-backend = "hatchling.build"

[project]
name = "my-cv"
dynamic = ["version"]
description = "CV Generator"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "polars>=1.5.0",
    "h5py>=3.11.0",
    "hdf5plugin>=5.0.0",
    "pydantic>=2.8.0",
    "streamlit>=1.37.0",
    "typst>=0.11.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
cv = "src.python.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.version]
source = "calver"
