- name: "CSC1109: Data Speed and Scale"
  description: Single-handedly modernized an aging BSc Data Science module on big
    data processing. Replaced legacy Vagrant environments with containerized Docker
    labs and deployed a modern ReadTheDocs/MkDocs site. The curriculum covers Hadoop,
    Hive, Pig, Storm, Spark, and cluster computing, culminating in students designing
    their own big data distributed analysis systems for targeted purposes.
  technologies:
    - Docker
    - Python
    - MkDocs
    - Hadoop
    - Spark
    - Hive
    - Pig
    - Storm
    - Education
  url: https://github.com/CA4022/CSC1109-Data-Speed-and-Scale
